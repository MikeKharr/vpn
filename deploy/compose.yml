# Личный VPN владельца: VLESS + REALITY на Xray-core.
# Решение целиком — ADR 2026-10-03-0353; перенос рабочего входа на второй
# адрес машины — ADR 2026-10-05-1546.
#
# Входов в этот Xray два, и это намеренно (ADR 2026-10-05-1546, п. 2):
#
#   РАБОЧИЙ, прямой: Xray сам публикует 443 ВТОРОГО адреса машины — строка
#   `ports` у службы `xray` ниже. Соединение приходит с интернета без
#   заголовка PROXY и попадает в inbound `vless-8443`. На этот адрес смотрит
#   A-запись `cdn.zpq.ai`, поэтому рабочие ссылки клиентов (именем, а не
#   адресом) не менялись.
#
#   ЗАПАСНОЙ, через соседа: соединение приходит по сети `edge` от единицы
#   `sni` проекта zpq-ai, которая делит 443 ПРЕЖНЕГО адреса машины по SNI и
#   присылает сюда SNI `cdn.zpq.ai` с заголовком PROXY protocol v2; оно
#   попадает в inbound `vless-443`. Это путь отката без PR — одной
#   A-записью — и вторая ссылка в клиентах (`bin/make-link.sh`).
#
# Межрепозиторный контракт из ADR 2026-10-03-0353, п. 1 (алиас `vpn`,
# `zpq:8444`, имя маски) этим не меняется: он держит запасной путь.
name: vpn

services:
  # Рендер конфига. Xray не читает переменные окружения, поэтому значения
  # (приватный ключ REALITY, UUID и shortId устройств) подставляются в
  # шаблон на старте и живут только в памяти: том `conf` — tmpfs
  # (ADR, п. 6, «Секреты»).
  #
  # Секреты видит ТОЛЬКО этот контейнер: у Xray ниже нет env_file, и
  # каталог конфига примонтирован ему на чтение. Утечка из Xray наружу
  # (журнал, дамп, exec) приватного ключа не выдаёт — в его окружении его нет.
  render:
    # Образ стоковый и закреплён тегом И digest, как `cron` в адвенте: смена
    # busybox под тем же тегом меняла бы поведение sed и grep без строки
    # диффа. Digest сверен с registry-1.docker.io 2026-10-03.
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    env_file:
      # required: true, в отличие от адвента: там один отсутствующий
      # env-файл уронил бы выкатку всех дней, здесь единица в проекте одна,
      # и «нет секретов» должно быть отказом разбора, а не контейнером,
      # который выглядит работающим с конфигом из плейсхолдеров.
      - path: ./secrets.env
        required: true
    environment:
      # Не секрет, поэтому ЗДЕСЬ, а не в secrets.env: это строка
      # межрепозиторного контракта (ADR, п. 1) — внутренний слушатель Caddy
      # проекта zpq-ai, за которым стоит ТОЛЬКО страница маски cdn.zpq.ai.
      # В secrets.env у неё не было ни одного держателя: значение набирал
      # руками владелец в файл, которого нет в git, и ошибка `caddy:443`
      # прошла бы и проверку формы, и `xray run -test`, и выкатку — признаком
      # остался бы только неподключающийся клиент (находка reviewer).
      # Здесь значение диффится, ревьюится и сверяется шагом CI «значение
      # XRAY_TARGET равно контрактному» — так же, как алиас `vpn`.
      #
      # Имя `zpq`, а не `caddy`: под именем `caddy` в сети edge отвечают два
      # Caddy — zpq-ai и адвента. Порт 8444, а не 443: отдельный внутренний
      # слушатель только с блоком маски, потому что проброс в общий вход
      # открывал бы клиенту VPN все имена машины (блокирующая к ADR zpq-ai
      # 2026-10-03-1544).
      XRAY_TARGET: "zpq:8444"
    volumes:
      - ./config.template.json:/template/config.json:ro
      - ./render:/render:ro
      - conf:/conf
    entrypoint: ["/bin/sh", "/render/entrypoint.sh"]
    # Единственный контейнер проекта, у которого приватный ключ в окружении, —
    # и сети ему не нужно вовсе: он исполняет sed и спит. Заодно не создаётся
    # сеть проекта vpn_default (предложение reviewer).
    network_mode: none
    healthcheck:
      # Файл появляется одним `mv` в самом конце render.sh, поэтому его
      # наличие — признак законченной подстановки, а не начатой.
      test: ["CMD", "test", "-s", "/conf/config.json"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    # Контейнер исполняет sed и спит. Потолок — сверх 320 МиБ, посчитанных в
    # ADR (256 Xray + 64 sni): третьей единицы там не было.
    mem_limit: 16m
    cpus: 0.25
    oom_score_adj: 500
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  xray:
    # Официальный образ XTLS, закреплён тегом И digest индекса манифестов
    # (ADR, п. 2). 26.9.30 — последняя версия на дату ADR; обновление ядра —
    # отдельный PR со сменой digest, и `xray run -test` в CI ловит
    # несовместимость конфига до выкатки.
    # Digest сверен с ghcr.io 2026-10-03. В образе User=65532 (nonroot),
    # шелла нет; порт 443 внутри контейнера непривилегированный, потому что
    # Docker ставит net.ipv4.ip_unprivileged_port_start=0.
    image: ghcr.io/xtls/xray-core:26.9.30@sha256:6d30597c3e729b5dc1faac8dbc0138fbbe6d4d787bfb54120ea48f14e2e7b5ca
    restart: unless-stopped
    # Умолчание образа — `-confdir /usr/local/etc/xray/`, то есть каталог,
    # которого у нас нет. Файл называется явно.
    command: ["run", "-c", "/conf/config.json"]
    volumes:
      # :ro — Xray конфиг только читает. Записать в tmpfs он не может,
      # значит и подменить себе конфигурацию из своего процесса — тоже.
      - conf:/conf:ro
    tmpfs:
      # В образе объявлены VOLUME /usr/local/etc/xray и /var/log/xray. Без
      # этих двух строк Docker заводил бы под них по анонимному тому на
      # каждое пересоздание контейнера и копил их на диске машины.
      # Журнал обращений выключен в конфиге (log.access: "none"), ошибки
      # идут в stdout — писать сюда Xray нечего, и размер взят под ноль.
      - /usr/local/etc/xray:mode=0755,size=1m
      - /var/log/xray:mode=0755,size=1m
    networks:
      # edge — внешняя сеть, общая с zpq-ai и адвентом; создаётся руками,
      # этим проектом не управляется. Алиас `vpn` — строка межрепозиторного
      # контракта (ADR, п. 1): по нему `sni` находит этот контейнер.
      # Больше ни в одной сети Xray не состоит: в сетях дней, `mcp`, `rag` и
      # почты контейнер не участвует.
      #
      # ЧЕГО ЭТО НЕ ЗНАЧИТ, названо прямо (находка reviewer): членство в одной
      # сети не делает остальное недостижимым. Из `edge` достижимы соседи по
      # мосту и шлюз моста, то есть хост с его опубликованными портами, и
      # правил, которые это закрывают, в DOCKER-USER нет, пока их не напишут.
      # Какие порты на машине открыты, из этого репозитория не видно и живьём
      # не проверялось. Что приватные цели клиенту закрыты — держит НЕ эта
      # сеть, а правило маршрутизации в config.template.json: blackhole на
      # приватные диапазоны при `domainStrategy: IPIfNonMatch`.
      edge:
        aliases:
          - vpn
    # ПЛЕЙСХОЛДЕР: заменить на адрес от ReadyIDC до мержа.
    # 203.0.113.1 — RFC 5737, TEST-NET-3: адрес, который не может оказаться
    # чьим-то. Пока он здесь, выкатка краснеет на привязке к несуществующему
    # адресу, а не уезжает на чужую машину.
    #
    # Публикация на весь проект РОВНО ОДНА (ADR 2026-10-05-1546, п. 7).
    # Разбор формы `<адрес>:443:8443` по частям — ломаются они по-разному:
    #
    #   8443 — порт ВНУТРИ контейнера, то есть inbound `vless-8443` из
    #   config.template.json, у которого `acceptProxyProtocol: false`. Именно
    #   он, а не `vless-443`: при `acceptProxyProtocol: true` Xray оборачивает
    #   слушатель в `proxyproto.Listener` с политикой **REQUIRE**
    #   (`transport/internet/system_listener.go:170`, v26.9.30 — проверено по
    #   исходнику, ADR 2026-10-05-1546, п. 1) и соединение БЕЗ заголовка
    #   PROXY отвергает. Прямой вход с интернета заголовка не несёт, значит в
    #   `vless-443` идти не может. Поэтому шаблон конфига этой строкой не
    #   меняется ни на знак: 8443 остаётся портом внутри контейнера, снаружи
    #   это 443.
    #
    #   443 — порт снаружи. Имя `cdn.zpq.ai` обязано отвечать на 443: на
    #   другом порту «SNI родной для своего адреса» (ADR 2026-10-03-0353,
    #   п. 1) перестаёт быть правдой, и маскировка держится ни на чём.
    #
    #   адрес — ЛИТЕРАЛ здесь, по тому же соображению, что `XRAY_TARGET`
    #   выше: он публичен через A-запись `cdn.zpq.ai`, а в `secrets.env` на
    #   сервере у него не было бы ни одного держателя — значение набирал бы
    #   руками владелец в файл, которого нет в git, и опечатка прошла бы и
    #   разбор, и выкатку (урок находки reviewer к `XRAY_TARGET`). Здесь он
    #   диффится, ревьюится и сверяется шагом CI «Compose разбирается и
    #   наружу опубликован ровно один порт».
    #
    #   адрес ОБЯЗАТЕЛЕН: голое `443:8443` — это ВСЕ адреса машины, то есть
    #   Xray отнял бы 443 у единицы `sni` на прежнем адресе и уронил сайты.
    #
    # ПОРЯДОК ВЫКАТКИ: сначала PR в zpq-ai, привязывающий `sni` к
    # `45.91.134.19:443:443`, и только потом этот. Распределитель портов
    # Docker требует, чтобы порт, запрошенный на конкретном адресе, был
    # свободен И в карте `0.0.0.0`
    # (moby, `daemon/libnetwork/portallocator/portallocator.go`,
    # `RequestPortsInRange` — проверено по исходнику, ADR 2026-10-05-1546,
    # п. 3). Пока `sni` держит `443:443` на всех адресах, привязка здесь
    # падает с `port is already allocated` — а контейнер к этому моменту уже
    # снесён `--force-recreate` шага выкатки, то есть VPN лежит до повторного
    # прогона.
    ports:
      # ПЛЕЙСХОЛДЕР: заменить на адрес от ReadyIDC до мержа.
      - "203.0.113.1:443:8443"
    depends_on:
      render:
        condition: service_healthy
    # Потолки из ADR, п. 6: запас ~10× над чужой оценкой простоя (~25 МиБ)
    # при известной склонности Xray удерживать буферы после всплесков.
    # oom_score_adj: 500 — как у rag и ollama в адвенте: при нехватке памяти
    # на общей машине ядро приходит сначала за этим контейнером, а не за
    # сайтами.
    mem_limit: 256m
    cpus: 1.0
    oom_score_adj: 500
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Отрендеренный конфиг с приватным ключом и UUID. tmpfs: значения живут в
  # памяти, на диск сервера не попадают и в бэкап диска не уезжают.
  conf:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0755

networks:
  edge:
    external: true
