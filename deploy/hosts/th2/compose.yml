# Наложение хоста th2 — Triplify Cloud NANO, 160.236.128.28, маска
# cdn2.zpq.ai. С 2026-10-06 это ОСНОВНОЙ сервер (ADR 2026-10-05-2223,
# решение владельца: «класс дата центра выше и локация в центре Бангкока»).
#
# Запуск только вместе с общей частью:
#   docker compose -f compose.yml -f hosts/th2/compose.yml up -d
#
# Чем th2 отличается от th1 по существу: маска живёт ЗДЕСЬ, а не в соседнем
# репозитории. На этой машине нет ни сети `edge`, ни единицы `sni`, ни
# PROXY protocol, ни запасного входа через соседа — вход один, прямой, и
# `target` REALITY — собственный Caddy в сети `mask`.
#
# Относительные пути (`./hosts/th2/...`) считаются от каталога ПЕРВОГО файла
# `-f`, то есть от ~/vpn/deploy, а не от каталога этого файла: так работает
# разрешение путей в compose при нескольких `-f`. Поэтому они записаны от
# deploy/, как `./config.template.json` в общей части.
services:
  render:
    environment:
      # `target` REALITY: внутренний слушатель Caddy маски ниже. Имя `mask` —
      # имя службы в сети `mask`, порт 8444 — слушатель, за которым стоит
      # ТОЛЬКО страница cdn2.zpq.ai.
      #
      # Порт 8444, а не 443: у этого Caddy наружу опубликован 80, и больше
      # ничего; 443 этой машины держит Xray. Проброс зонда REALITY ходит
      # внутрь по сети проекта и наружу не выходит вовсе.
      XRAY_TARGET: "mask:8444"
      # Имя маски в `serverNames` REALITY — то же, что в сертификате Caddy
      # ниже и в `sni=` ссылок th2 (bin/make-link.sh). Расхождение любых двух
      # из трёх даёт сервер, который отвечает, и клиента, который не
      # подключается.
      MASK_NAME: "cdn2.zpq.ai"
  xray:
    networks:
      # Своя сеть проекта, а не `edge`: на th2 соседей нет, и делить мост не
      # с кем. Из неё Xray достаёт `mask:8444` по имени службы и выходит в
      # интернет через NAT моста — это рабочий путь клиентского трафика.
      #
      # Что приватные цели клиенту закрыты — держит НЕ эта сеть, а правило
      # маршрутизации в config.template.json (blackhole на приватные
      # диапазоны при `domainStrategy: IPIfNonMatch`): из `mask` достижимы и
      # Caddy, и шлюз моста, то есть хост.
      - mask
    # 160.236.128.28:443:8443 — вход клиентов. Разбор формы по частям — тот
    # же, что у th1 (hosts/th1/compose.yml): 8443 внутри — это inbound
    # `vless-8443` с `acceptProxyProtocol: false`, единственный, куда может
    # попасть соединение с интернета без заголовка PROXY; 443 снаружи — иначе
    # «SNI родной для своего адреса» перестаёт быть правдой; адрес литералом
    # и обязателен.
    #
    # Inbound `vless-443` остаётся в шаблоне, но на этом хосте НЕ опубликован
    # (ADR 2026-10-05-2223, «Ручные шаги»): внутренний порт без слушателя
    # снаружи.
    ports:
      - "160.236.128.28:443:8443"

  # Маска cdn2.zpq.ai: `target` REALITY и обычный с виду хост статики.
  #
  # Это ТРЕТЬЯ служба проекта и единственная, которой нет на th1. Зачем она
  # вообще: без своей маски пришлось бы либо занимать чужой SNI (главный
  # признак блокировок 2026), либо делать `target` th2 → th1, то есть резерв,
  # живущий ровно пока жив основной (ADR 2026-10-05-2223, «Альтернативы»).
  mask:
    # Стоковый Caddy, закреплён тегом И digest индекса манифестов. Digest
    # сверен с registry-1.docker.io 2026-10-06 (`docker-content-digest` на
    # HEAD манифеста тега). Обновление — отдельный PR со сменой digest, и
    # `caddy adapt` в CI ловит несовместимость конфигурации до выкатки.
    image: caddy:2.11.7-alpine@sha256:d76116d819d5162f464b0f2cd09bd28c568a86148c7bc539ce17c33eb22d8bbb
    restart: unless-stopped
    volumes:
      - ./hosts/th2/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hosts/th2/cdn:/srv/cdn:ro
      # Сертификат cdn2.zpq.ai и ключ учётной записи ACME. Том, а не tmpfs и
      # не каталог репозитория: без него каждое пересоздание контейнера
      # выпускало бы сертификат заново и упиралось в лимит Let's Encrypt
      # (5 выпусков на имя в неделю), а выкатка пересоздаёт ВСЁ
      # (`--force-recreate`, deploy.yml).
      - caddy_data:/data
      - caddy_config:/config
    # Порт 80 этой машины — намеренно (ADR 2026-10-05-2223, п. 1): по нему
    # Caddy проходит ACME HTTP-01 для cdn2.zpq.ai и отвечает редиректом на
    # https, как любой хост статики. Второй тип проверки, TLS-ALPN-01, пришёл
    # бы на 443, то есть в Xray, и дошёл бы сюда только пробросом зонда с
    # ALPN `acme-tls/1` — на это не рассчитываем, certmagic сам переходит к
    # HTTP-01.
    #
    # Адрес литералом и обязателен по той же причине, что у xray: голое
    # `80:80` — это ВСЕ адреса машины. Публикаций на th2 ровно две, и держит
    # это .github/scripts/publication-guard.sh th2.
    #
    # Слушатель :8444 наружу НЕ публикуется: он достижим только из сети
    # `mask`, то есть только пробросом REALITY. Это и есть разница между
    # «страницу видит зонд цензора» и «порт 8444 есть у машины снаружи».
    ports:
      - "160.236.128.28:80:80"
    networks:
      - mask
    # 1 ГиБ ОЗУ на машине: Xray 256 МиБ + Caddy 64 + render 16 (ADR
    # 2026-10-05-2223, «Последствия»). oom_score_adj НЕ поднят до 500, как у
    # xray и render: при нехватке памяти ядро должно прийти сначала за ними,
    # а не за маской — без маски `target` REALITY мёртв, и не подключается
    # НИ ОДНО устройство, тогда как перезапуск xray стоит разрыва на секунды.
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Сеть проекта, создаётся самим compose. Не `internal: true`: Caddy нужен
  # выход к Let's Encrypt, а Xray — в интернет по определению.
  #
  # enable_ipv6 задан ЯВНО, хотя false и так умолчание: это проверяемое
  # свойство из таблицы ADR 2026-10-05-2223 («IPv6»), и
  # `docker network inspect vpn_mask --format '{{.EnableIPv6}}'` обязан
  # отвечать false независимо от умолчаний демона на машине провайдера.
  mask:
    driver: bridge
    enable_ipv6: false

volumes:
  caddy_data:
  caddy_config:
