# Наложение хоста th1 — ReadyIDC, 45.91.134.19 (прежний адрес, сайты и
# единица `sni`) и 45.91.134.23 (второй адрес, VPN). Маска — cdn.zpq.ai в
# проекте zpq-ai на этой же машине. С 2026-10-06 это РЕЗЕРВ (ADR
# 2026-10-05-2223, решение владельца: основной — th2).
#
# Запуск только вместе с общей частью:
#   docker compose -f compose.yml -f hosts/th1/compose.yml up -d
#
# Поведение th1 этим файлом не меняется ни на знак: здесь ровно те строки,
# которые до ADR 2026-10-05-2223 стояли в deploy/compose.yml. Проверка —
# `docker compose config` даёт ту же публикацию, тот же алиас и тот же
# XRAY_TARGET (ADR, «Ручные шаги», п. 1).
services:
  render:
    environment:
      # Не секрет, поэтому ЗДЕСЬ, а не в secrets.env: это строка
      # межрепозиторного контракта (ADR 2026-10-03-0353, п. 1) — внутренний
      # слушатель Caddy проекта zpq-ai, за которым стоит ТОЛЬКО страница маски
      # cdn.zpq.ai. Здесь значение диффится, ревьюится и сверяется шагом CI
      # «Наложение хоста держит публикацию, сети и контракт».
      #
      # Имя `zpq`, а не `caddy`: под именем `caddy` в сети edge отвечают два
      # Caddy — zpq-ai и адвента. Порт 8444, а не 443: отдельный внутренний
      # слушатель только с блоком маски, потому что проброс в общий вход
      # открывал бы клиенту VPN все имена машины (блокирующая к ADR zpq-ai
      # 2026-10-03-1544).
      XRAY_TARGET: "zpq:8444"
      # Имя маски в `serverNames` REALITY. До ADR 2026-10-05-2223 стояло
      # литералом в config.template.json; теперь шаблон один на два хоста, и
      # имя приезжает сюда. Клиентская ссылка обязана нести `sni=` с ТЕМ ЖЕ
      # именем, иначе рукопожатия не будет (bin/make-link.sh, карта хостов).
      MASK_NAME: "cdn.zpq.ai"
  xray:
    networks:
      # edge — внешняя сеть, общая с zpq-ai и адвентом; создаётся руками,
      # этим проектом не управляется. Алиас `vpn` — строка межрепозиторного
      # контракта (ADR 2026-10-03-0353, п. 1): по нему `sni` находит этот
      # контейнер и присылает соединения с SNI cdn.zpq.ai и заголовком PROXY
      # protocol v2 в inbound `vless-443`. Это ЗАПАСНОЙ вход th1 и путь
      # откатa без PR — одной A-записью.
      # Больше ни в одной сети Xray не состоит: в сетях дней, `mcp`, `rag` и
      # почты контейнер не участвует.
      #
      # ЧЕГО ЭТО НЕ ЗНАЧИТ, названо прямо (находка reviewer): членство в одной
      # сети не делает остальное недостижимым. Из `edge` достижимы соседи по
      # мосту и шлюз моста, то есть хост с его опубликованными портами, и
      # правил, которые это закрывают, в DOCKER-USER нет, пока их не напишут.
      # Что приватные цели клиенту закрыты — держит НЕ эта сеть, а правило
      # маршрутизации в config.template.json: blackhole на приватные
      # диапазоны при `domainStrategy: IPIfNonMatch`.
      edge:
        aliases:
          - vpn
    # 45.91.134.23 — ВТОРОЙ адрес той же машины ReadyIDC, выданный владельцем
    # под VPN (ADR 2026-10-05-1546). Прежний адрес 45.91.134.19 остаётся за
    # сайтами и за единицей `sni`: на нём живёт запасной вход.
    #
    # Публикация на этом хосте РОВНО ОДНА (ADR 2026-10-05-1546, п. 7; держит
    # .github/scripts/publication-guard.sh th1). Разбор формы
    # `<адрес>:443:8443` по частям — ломаются они по-разному:
    #
    #   8443 — порт ВНУТРИ контейнера, то есть inbound `vless-8443` из
    #   config.template.json, у которого `acceptProxyProtocol: false`. Именно
    #   он, а не `vless-443`: при `acceptProxyProtocol: true` Xray оборачивает
    #   слушатель в `proxyproto.Listener` с политикой **REQUIRE**
    #   (`transport/internet/system_listener.go:170`, v26.9.30 — проверено по
    #   исходнику, ADR 2026-10-05-1546, п. 1) и соединение БЕЗ заголовка
    #   PROXY отвергает. Прямой вход с интернета заголовка не несёт, значит в
    #   `vless-443` идти не может.
    #
    #   443 — порт снаружи. Имя `cdn.zpq.ai` обязано отвечать на 443: на
    #   другом порту «SNI родной для своего адреса» (ADR 2026-10-03-0353,
    #   п. 1) перестаёт быть правдой, и маскировка держится ни на чём.
    #
    #   адрес — ЛИТЕРАЛ: он публичен через A-запись `cdn.zpq.ai`, а в
    #   `secrets.env` на сервере у него не было бы ни одного держателя.
    #
    #   адрес ОБЯЗАТЕЛЕН: голое `443:8443` — это ВСЕ адреса машины, то есть
    #   Xray отнял бы 443 у единицы `sni` на прежнем адресе и уронил сайты.
    #
    # ПОРЯДОК ВЫКАТКИ (история, уже исполнена): сначала PR в zpq-ai,
    # привязывающий `sni` к `45.91.134.19:443:443`, и только потом публикация
    # здесь. Распределитель портов Docker требует, чтобы порт, запрошенный на
    # конкретном адресе, был свободен И в карте `0.0.0.0`
    # (moby, `daemon/libnetwork/portallocator/portallocator.go`,
    # `RequestPortsInRange` — проверено по исходнику, ADR 2026-10-05-1546,
    # п. 3).
    ports:
      - "45.91.134.23:443:8443"

networks:
  edge:
    external: true
