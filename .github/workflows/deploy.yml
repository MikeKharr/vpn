name: deploy

on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: выкатка ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Матрица из двух хостов (ADR 2026-10-05-2223, «Решения», п. 2; «Ручные
    # шаги», п. 6). В одной строке стоят имя хоста и его environment, поэтому
    # «секреты одного хоста с наложением другого» невозможны по форме, а не
    # по внимательности.
    strategy:
      # Красный th2 не отменяет th1 и наоборот: это две независимые машины, и
      # лежащий основной не должен запрещать выкатить резерв — ровно для этого
      # второй сервер и куплен.
      fail-fast: false
      # По одному: иначе оба сервера пересоздавались бы одновременно, и окно
      # «лежат оба» открывалось бы на каждой выкатке.
      max-parallel: 1
      matrix:
        # Порядок строк при `max-parallel: 1` — порядок прогона, и он выбран,
        # а не случаен: РЕЗЕРВ (th1) первым, ОСНОВНОЙ (th2) вторым. Изменение,
        # которое краснит проверки самой выкатки (конфиг, образ, зонд маски),
        # бьёт сначала по серверу, с которого клиенты в этот момент не ходят.
        #
        # Это НЕ гейт, и сказано прямо: второй job не ждёт зелёного первого
        # (иначе лежащий резерв запрещал бы чинить основной). Отменить прогон
        # между ними владелец может только руками.
        include:
          - host: th1
            environment: production
          - host: th2
            # Свой environment, а не те же секреты: другая машина, другой
            # ключ выкатки, другое имя. Существующий `production` НЕ
            # переименован — иначе владельцу пришлось бы вводить три значения
            # заново (ADR 2026-10-05-2223, «Решения», п. 2).
            environment: production-th2
    environment: ${{ matrix.environment }}
    env:
      # Хост выкатки — из строки матрицы, и ниже он стоит везде, где нужно
      # имя хоста: путь к закреплённому ключу, аргумент удалённого скрипта,
      # наложение, из которого зонд маски берёт адрес и имя.
      HOST: ${{ matrix.host }}
    steps:
      # Нужен каталог deploy: его содержимое и уезжает на сервер, в нём же
      # лежит закреплённый ключ хоста. Токен на диске не сохраняется.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Отдельный шаг и первым: без него отсутствующий секрет превращался бы
      # в «Permission denied (publickey)» или в попытку сходить на пустое
      # имя — то есть в отказ, который указывает не на причину. Секреты
      # каждого environment заводит владелец (ADR 2026-10-03-0353, «Ручные
      # шаги», п. 3 — `production`; ADR 2026-10-05-2223, «Ручные шаги», п. 4 —
      # `production-th2`), и до этого момента выкатка обязана говорить, чего
      # именно нет и где.
      #
      # С матрицей этот шаг — единственное, что отделяет «environment ещё не
      # завели» от молчаливого пропуска: незаведённый или пустой environment
      # даёт шагам ПУСТЫЕ секреты, а не остановку прогона, и без этой
      # проверки job дошёл бы до ssh и упал бы отказом про publickey. Имя
      # environment печатается в отказе: при двух хостах иначе непонятно,
      # который из двух job'ов на что жалуется.
      - name: Секреты выкатки заведены
        env:
          ENV_NAME: ${{ matrix.environment }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          missing=''
          [ -n "$SSH_KEY" ] || missing="$missing SSH_KEY"
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          if [ -n "$missing" ]; then
            echo "::error::в environment $ENV_NAME (хост $HOST) нет секретов:$missing — их заводит владелец: gh secret set <имя> --env $ENV_NAME -R MikeKharr/vpn; SSH_PORT необязателен, по умолчанию 22. Для th2 это ADR 2026-10-05-2223, «Ручные шаги», п. 4; для th1 — ADR 2026-10-03-0353, п. 3"
            exit 1
          fi
          echo "ok: в environment $ENV_NAME есть SSH_KEY, SSH_HOST и SSH_USER"

      # Секреты — через env шага, а не подстановкой в текст run: так их нет
      # в файле скрипта шага и в команде, которую видит shell.
      - name: Ключ доступа
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключ хоста ЗАКРЕПЛЁН в репозитории, а не выспрашивается у сервера:
          # `ssh-keyscan >> known_hosts` на каждом прогоне принимал бы любой
          # предъявленный ключ, то есть и подменённый. Образец и причина —
          # адвент, ADR 2026-10-02-0921. Сервер тот же, ключ тот же файл.
          #
          # Закрепляется КЛЮЧ, а не имя: SSH_HOST — секрет, и в файле
          # репозитория имени нет вовсе. Имя считается ДО записи, потому что
          # ssh ищет запись в форме [host]:port, когда порт не 22.
          name="$SSH_HOST"
          [ "$SSH_PORT" = "22" ] || name="[$SSH_HOST]:$SSH_PORT"
          # Ключ лежит В КАТАЛОГЕ СВОЕГО ХОСТА: с двумя машинами один файл
          # `deploy/host-key.pub` означал бы либо ключ одного хоста,
          # предъявленный другому (ssh отказывает, и отказ выглядит атакой),
          # либо два ключа в одном файле без привязки к машине.
          key_file="$GITHUB_WORKSPACE/deploy/hosts/$HOST/host-key.pub"
          if [ ! -s "$key_file" ]; then
            echo "::error::нет $key_file — закреплённый ключ хоста $HOST пропал из репозитория; его передаёт владелец строкой ssh-keyscan после сверки отпечатка (ADR 2026-10-05-2223, «Ручные шаги», п. 3)"
            exit 1
          fi
          printf '%s %s\n' "$name" "$(cat "$key_file")" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$name" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::строка known_hosts не собралась для этого сервера"
            exit 1
          fi

      # Файлы едут rsync'ом, а не git pull: git-клона этого репозитория на
      # сервере нет и не будет — рядом с каталогом deploy лежит secrets.env,
      # и чем меньше на сервере умеет этот каталог, тем лучше.
      - name: Файлы каталога deploy на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p vpn/deploy'
          # --delete: файл, убранный из репозитория, должен исчезнуть и на
          # сервере — иначе старый шаблон или старый скрипт рендера остался бы
          # жить рядом с новым compose.
          # --exclude '*.env': secrets.env кладёт туда владелец, и rsync его
          # НЕ трогает. Под --delete исключённое на приёмной стороне не
          # удаляется, поэтому выкатка не сносит секреты. Это ровно то место,
          # где ошибка стоила бы владельцу повторного ввода пяти значений.
          rsync -az --delete \
            --exclude='*.env' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            deploy/ "$SSH_USER@$SSH_HOST:vpn/deploy/"

      - name: Выкатка
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Имя хоста едет АРГУМЕНТОМ (`bash -s -- $HOST`), а не подстановкой в
          # текст: heredoc стоит в кавычках ('REMOTE'), и ни одна строка внутри
          # не раскрывается на раннере. Так же на сервер ничего не попадает в
          # командную строку ssh, кроме имени хоста — а оно не секрет.
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "bash -s -- $HOST" <<'REMOTE'
          set -euo pipefail
          cd ~/vpn/deploy

          # Наложение хоста ОБЯЗАТЕЛЬНО: с ADR 2026-10-05-2223 общий
          # compose.yml сам не запускается — в нём нет ни публикации портов, ни
          # сетей, ни XRAY_TARGET, ни MASK_NAME. Без `-f hosts/$HOST/compose.yml`
          # выкатка сняла бы у Xray опубликованный порт и уронила вход, а
          # render отказался бы с кодом 2.
          HOST="${1:?не передано имя хоста}"
          if [ ! -f "hosts/$HOST/compose.yml" ]; then
            echo "::error::на сервере нет hosts/$HOST/compose.yml — наложение не приехало rsync'ом, а без него общий compose.yml не запускается (ADR 2026-10-05-2223, п. 2)"
            exit 1
          fi
          compose=(docker compose -f compose.yml -f "hosts/$HOST/compose.yml")

          if [ ! -f secrets.env ]; then
            echo "::error::на сервере нет vpn/deploy/secrets.env — его кладёт владелец скриптом deploy/put-secrets.sh; единица render стоит required: true и без файла проект не разберётся"
            exit 1
          fi
          chmod 600 secrets.env

          # Id контейнера Xray ДО выкатки: по нему шаг ниже отличает
          # «пересоздан» от «работает с прежним конфигом». Пусто — первая
          # выкатка на эту машину.
          id_before=$(docker inspect --format '{{.Id}}' vpn-xray-1 2>/dev/null || true)

          echo "==> пересоздание ОБЕИХ служб"
          # --force-recreate без имён служб, то есть для всего проекта.
          #
          # Прежняя редакция делала `up -d --force-recreate render` и затем
          # `up -d`. Это ничего не пересоздавало у Xray: имя службы в первой
          # команде сужает её граф до `render` и его ЗАВИСИМОСТЕЙ, а `xray` —
          # зависимый; вторая команда шла без флага и пересоздавала только то,
          # у чего разошёлся хеш конфигурации, а у `xray` не менялись ни строка
          # службы, ни digest образа. Xray читает config.json один раз на
          # старте и reload'а не умеет, поэтому ротация ключа и отзыв
          # устройства не вступали в силу при зелёной выкатке
          # (блокирующая reviewer).
          #
          # Почему не `--always-recreate-deps`: этот флаг пересоздаёт
          # зависимости названной службы, то есть решает ту же задачу с
          # обратной стороны и требует помнить, какая из двух служб названа.
          # Служб здесь две, обе без состояния, и «пересоздать всё» не оставляет
          # места для той же ошибки. Цена названа прямо: VPN рвётся на секунды
          # при каждой выкатке — для личного VPN на два устройства это дешевле,
          # чем тихо не применённый отзыв устройства.
          "${compose[@]}" up -d --force-recreate --remove-orphans
          docker image prune -f --filter "until=168h" || true

          echo "==> ожидание render: healthy"
          state=none
          for _ in $(seq 1 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' vpn-render-1 2>/dev/null || echo none)
            [ "$state" = healthy ] && break
            sleep 3
          done
          if [ "$state" != healthy ]; then
            # Журнал рендера печатать можно: он сообщает ИМЕНА значений и коды
            # отказа, но не сами значения (deploy/render/render.sh).
            "${compose[@]}" logs --tail 30 render
            echo "::error::render не стал healthy: $state — конфиг не собран, Xray не поднимется"
            exit 1
          fi

          echo "==> проверка, что Xray не перезапускается"
          # 15 секунд и RestartCount: негодный конфиг даёт не «не поднялся», а
          # крутящийся контейнер, который в `ps` выглядит живым пару секунд.
          sleep 15
          running=$(docker inspect --format '{{.State.Running}}' vpn-xray-1)
          restarts=$(docker inspect --format '{{.RestartCount}}' vpn-xray-1)
          echo "xray: Running=$running RestartCount=$restarts"
          if [ "$running" != true ] || [ "$restarts" != 0 ]; then
            # Журнал Xray — только последние строки и только при отказе:
            # репозиторий публичный, журнал обращений выключен в конфиге
            # (log.access: "none"), поэтому адресов клиентов здесь быть не
            # может, а причина отказа конфига — может.
            "${compose[@]}" logs --tail 30 xray
            echo "::error::контейнер xray не держится: Running=$running RestartCount=$restarts"
            exit 1
          fi

          echo "==> Xray пересоздан именно этой выкаткой"
          # Проверка вынесена в deploy/assert-recreated.sh: тот же файл
          # исполняют приманки test/assert-recreated.test.sh. Здесь он уже
          # лежит рядом — каталог deploy приехал rsync'ом шагом выше.
          #
          # RestartCount=0 выше эту гипотезу НЕ различает: «устойчив» и
          # «устойчив с прежним конфигом» дают одно и то же число.
          id_after=$(docker inspect --format '{{.Id}}' vpn-xray-1 2>/dev/null || true)
          render_started=$(docker inspect --format '{{.State.StartedAt}}' vpn-render-1)
          xray_started=$(docker inspect --format '{{.State.StartedAt}}' vpn-xray-1)
          sh assert-recreated.sh "$id_before" "$id_after" "$render_started" "$xray_started"

          echo "==> состояние"
          "${compose[@]}" ps
          REMOTE

      # Живая проверка СНАРУЖИ машины, с раннера. До ADR 2026-10-05-1546 её
      # здесь не было вовсе и быть не могло: вход приходил от единицы `sni`
      # проекта zpq-ai, и «доходит ли соединение снаружи» было делом другого
      # репозитория. Теперь Xray публикует порт сам — и отвечает за это сам.
      #
      # ЧТО ОНА РАЗЛИЧАЕТ (две гипотезы, не одна):
      #   нет слушателя Xray на этом адресе — привязка не встала, адрес не
      #   поднят на хосте, контейнер не держится: curl получает отказ
      #   соединения или таймаут, код не 200;
      #   слушатель есть — REALITY пробрасывает неаутентифицированный зонд во
      #   внутренний слушатель маски своего хоста (`zpq:8444` у th1,
      #   `mask:8444` у th2), и раннер видит страницу этой маски с НАСТОЯЩИМ
      #   сертификатом, то есть 200.
      #
      # БЕЗ `-k` намеренно: с ним зелёным был бы и ответ любого чужого TLS на
      # этом адресе, и проверка перестала бы отличать «наш слушатель» от
      # «чей-то». Настоящий сертификат маски — часть улики.
      #
      # `--resolve`, а не просто имя: адрес берётся из compose, а не из DNS.
      # Иначе шаг зеленел бы на ПРЕЖНЕМ пути через `sni`, пока A-запись
      # `cdn.zpq.ai` не переехала, — то есть ровно тогда, когда отличить одно
      # от другого нужнее всего. Адрес читается из того же файла, что уехал
      # на сервер шагом выше, и вторым местом здесь не записан.
      #
      # ЧЕГО ОНА НЕ ДОКАЗЫВАЕТ: рукопожатия REALITY с ключом клиента. Зонд
      # идёт мимо VLESS, и маска отвечает ровно так же всем — в том числе
      # цензору, который её и должен увидеть.
      - name: Снаружи отвечает маска на опубликованном адресе
        run: |
          set -euo pipefail
          # `docker compose config` читает env_file ./secrets.env с
          # required: true, а на раннере его нет и быть не должно. Разбору
          # хватает ПУСТОГО файла: нужны не значения, а один host_ip из
          # строки ports. Файл рождается ПОСЛЕ rsync, поэтому на сервер не
          # уезжает и чужой secrets.env там не трогает.
          : > deploy/secrets.env
          # И адрес, и ИМЯ маски берутся из наложения своего хоста (ADR
          # 2026-10-05-2223, п. 2). Имя литералом здесь больше не стоит: с
          # двумя хостами литерал `cdn.zpq.ai` на th2 давал бы зелёный зонд к
          # ЧУЖОМУ серверу — тот отвечает 200, и шаг не отличил бы «маска th2
          # жива» от «жива маска th1».
          json=$(docker compose -f deploy/compose.yml \
                   -f "deploy/hosts/$HOST/compose.yml" config --format json)
          ip=$(printf '%s' "$json" | jq -r '.services.xray.ports[0].host_ip // ""')
          mask=$(printf '%s' "$json" | jq -r '.services.render.environment.MASK_NAME // ""')
          if [ -z "$ip" ] || [ -z "$mask" ]; then
            echo "::error::в наложении deploy/hosts/$HOST/compose.yml нет адреса публикации xray («$ip») или MASK_NAME («$mask») — проверять снаружи нечего; форму держит шаг ci.yml «Наложения хостов разбираются и держат публикации»"
            exit 1
          fi
          echo "из наложения $HOST: адрес $ip, маска $mask"
          # 6 попыток по 5 с, как у соседних проверок выше: контейнер только
          # что пересоздан, и слушателю нужна секунда-другая.
          code=''
          for _ in $(seq 1 6); do
            code=$(curl -sS --max-time 15 \
                     --resolve "$mask:443:$ip" \
                     -o /dev/null -w '%{http_code}' \
                     "https://$mask/" || true)
            echo "попытка: код $code"
            [ "$code" = 200 ] && break
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "::error::https://$mask/ на $ip ответил «$code», а не 200. Либо Xray не слушает этот адрес (привязка не встала, адрес не поднят на хосте — проверка владельца: nc -vz -w 5 $ip 22), либо проброс REALITY во внутренний слушатель маски не отвечает, либо сертификат маски не тот. ADR 2026-10-05-1546, «Ручные шаги», п. 1 и 3"
            exit 1
          fi
          echo "ok: маска $mask отвечает 200 на $ip, сертификат настоящий"

      - name: Чего выкатка не доказала
        run: |
          # Названо шагом, а не комментарием: зелёный прогон здесь легко
          # прочитать как «VPN работает».
          echo "Выкатка доказала: конфиг собран без плейсхолдеров, контейнер xray пересоздан"
          echo "этой выкаткой и держится, то есть он читал именно новый конфиг."
          echo "Шаг выше доказал сверх этого: соединение ДОХОДИТ снаружи на опубликованный"
          echo "адрес и получает страницу маски с настоящим сертификатом через проброс во"
          echo "внутренний слушатель маски — то есть слушатель Xray на этом адресе живой."
          echo "Выкатка НЕ доказала: на th1 — что алиас vpn в сети edge РАЗРЕШАЕТСЯ у соседей"
          echo "(это запасной путь через единицу sni; шаг CI проверяет его по тексту compose, а"
          echo "не живым запросом); на любом хосте — что REALITY проходит рукопожатие (зонд"
          echo "маски идёт мимо VLESS и ключа клиента не касается) и что устройство"
          echo "подключается; и что ЖИВ ВТОРОЙ хост: job'ы независимы (fail-fast: false), и"
          echo "зелёный прогон одного ничего не говорит о другом."
          echo "Проверка — живым подключением с Mac и iPhone (ADR 2026-10-03-0353, «Ручные шаги»,"
