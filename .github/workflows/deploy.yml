name: deploy

on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Нужен каталог deploy: его содержимое и уезжает на сервер, в нём же
      # лежит закреплённый ключ хоста. Токен на диске не сохраняется.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Отдельный шаг и первым: без него отсутствующий секрет превращался бы
      # в «Permission denied (publickey)» или в попытку сходить на пустое
      # имя — то есть в отказ, который указывает не на причину. Секреты
      # environment production заводит владелец (ADR 2026-10-03-0353,
      # «Ручные шаги», п. 3), и до этого момента выкатка обязана говорить,
      # чего именно нет.
      - name: Секреты выкатки заведены
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          missing=''
          [ -n "$SSH_KEY" ] || missing="$missing SSH_KEY"
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          if [ -n "$missing" ]; then
            echo "::error::в environment production нет секретов:$missing — их заводит владелец (ADR 2026-10-03-0353, «Ручные шаги», п. 3); SSH_PORT необязателен, по умолчанию 22"
            exit 1
          fi
          echo "ok: SSH_KEY, SSH_HOST и SSH_USER на месте"

      # Секреты — через env шага, а не подстановкой в текст run: так их нет
      # в файле скрипта шага и в команде, которую видит shell.
      - name: Ключ доступа
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключ хоста ЗАКРЕПЛЁН в репозитории, а не выспрашивается у сервера:
          # `ssh-keyscan >> known_hosts` на каждом прогоне принимал бы любой
          # предъявленный ключ, то есть и подменённый. Образец и причина —
          # адвент, ADR 2026-10-02-0921. Сервер тот же, ключ тот же файл.
          #
          # Закрепляется КЛЮЧ, а не имя: SSH_HOST — секрет, и в файле
          # репозитория имени нет вовсе. Имя считается ДО записи, потому что
          # ssh ищет запись в форме [host]:port, когда порт не 22.
          name="$SSH_HOST"
          [ "$SSH_PORT" = "22" ] || name="[$SSH_HOST]:$SSH_PORT"
          key_file="$GITHUB_WORKSPACE/deploy/host-key.pub"
          if [ ! -s "$key_file" ]; then
            echo "::error::нет $key_file — закреплённый ключ хоста пропал из репозитория"
            exit 1
          fi
          printf '%s %s\n' "$name" "$(cat "$key_file")" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$name" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::строка known_hosts не собралась для этого сервера"
            exit 1
          fi

      # Файлы едут rsync'ом, а не git pull: git-клона этого репозитория на
      # сервере нет и не будет — рядом с каталогом deploy лежит secrets.env,
      # и чем меньше на сервере умеет этот каталог, тем лучше.
      - name: Файлы каталога deploy на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'mkdir -p vpn/deploy'
          # --delete: файл, убранный из репозитория, должен исчезнуть и на
          # сервере — иначе старый шаблон или старый скрипт рендера остался бы
          # жить рядом с новым compose.
          # --exclude '*.env': secrets.env кладёт туда владелец, и rsync его
          # НЕ трогает. Под --delete исключённое на приёмной стороне не
          # удаляется, поэтому выкатка не сносит секреты. Это ровно то место,
          # где ошибка стоила бы владельцу повторного ввода пяти значений.
          rsync -az --delete \
            --exclude='*.env' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            deploy/ "$SSH_USER@$SSH_HOST:vpn/deploy/"

      - name: Выкатка
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/vpn/deploy

          if [ ! -f secrets.env ]; then
            echo "::error::на сервере нет vpn/deploy/secrets.env — его кладёт владелец скриптом deploy/put-secrets.sh; единица render стоит required: true и без файла проект не разберётся"
            exit 1
          fi
          chmod 600 secrets.env

          # Id контейнера Xray ДО выкатки: по нему шаг ниже отличает
          # «пересоздан» от «работает с прежним конфигом». Пусто — первая
          # выкатка на эту машину.
          id_before=$(docker inspect --format '{{.Id}}' vpn-xray-1 2>/dev/null || true)

          echo "==> пересоздание ОБЕИХ служб"
          # --force-recreate без имён служб, то есть для всего проекта.
          #
          # Прежняя редакция делала `up -d --force-recreate render` и затем
          # `up -d`. Это ничего не пересоздавало у Xray: имя службы в первой
          # команде сужает её граф до `render` и его ЗАВИСИМОСТЕЙ, а `xray` —
          # зависимый; вторая команда шла без флага и пересоздавала только то,
          # у чего разошёлся хеш конфигурации, а у `xray` не менялись ни строка
          # службы, ни digest образа. Xray читает config.json один раз на
          # старте и reload'а не умеет, поэтому ротация ключа и отзыв
          # устройства не вступали в силу при зелёной выкатке
          # (блокирующая reviewer).
          #
          # Почему не `--always-recreate-deps`: этот флаг пересоздаёт
          # зависимости названной службы, то есть решает ту же задачу с
          # обратной стороны и требует помнить, какая из двух служб названа.
          # Служб здесь две, обе без состояния, и «пересоздать всё» не оставляет
          # места для той же ошибки. Цена названа прямо: VPN рвётся на секунды
          # при каждой выкатке — для личного VPN на два устройства это дешевле,
          # чем тихо не применённый отзыв устройства.
          docker compose up -d --force-recreate --remove-orphans
          docker image prune -f --filter "until=168h" || true

          echo "==> ожидание render: healthy"
          state=none
          for _ in $(seq 1 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' vpn-render-1 2>/dev/null || echo none)
            [ "$state" = healthy ] && break
            sleep 3
          done
          if [ "$state" != healthy ]; then
            # Журнал рендера печатать можно: он сообщает ИМЕНА значений и коды
            # отказа, но не сами значения (deploy/render/render.sh).
            docker compose logs --tail 30 render
            echo "::error::render не стал healthy: $state — конфиг не собран, Xray не поднимется"
            exit 1
          fi

          echo "==> проверка, что Xray не перезапускается"
          # 15 секунд и RestartCount: негодный конфиг даёт не «не поднялся», а
          # крутящийся контейнер, который в `ps` выглядит живым пару секунд.
          sleep 15
          running=$(docker inspect --format '{{.State.Running}}' vpn-xray-1)
          restarts=$(docker inspect --format '{{.RestartCount}}' vpn-xray-1)
          echo "xray: Running=$running RestartCount=$restarts"
          if [ "$running" != true ] || [ "$restarts" != 0 ]; then
            # Журнал Xray — только последние строки и только при отказе:
            # репозиторий публичный, журнал обращений выключен в конфиге
            # (log.access: "none"), поэтому адресов клиентов здесь быть не
            # может, а причина отказа конфига — может.
            docker compose logs --tail 30 xray
            echo "::error::контейнер xray не держится: Running=$running RestartCount=$restarts"
            exit 1
          fi

          echo "==> Xray пересоздан именно этой выкаткой"
          # Проверка вынесена в deploy/assert-recreated.sh: тот же файл
          # исполняют приманки test/assert-recreated.test.sh. Здесь он уже
          # лежит рядом — каталог deploy приехал rsync'ом шагом выше.
          #
          # RestartCount=0 выше эту гипотезу НЕ различает: «устойчив» и
          # «устойчив с прежним конфигом» дают одно и то же число.
          id_after=$(docker inspect --format '{{.Id}}' vpn-xray-1 2>/dev/null || true)
          render_started=$(docker inspect --format '{{.State.StartedAt}}' vpn-render-1)
          xray_started=$(docker inspect --format '{{.State.StartedAt}}' vpn-xray-1)
          sh assert-recreated.sh "$id_before" "$id_after" "$render_started" "$xray_started"

          echo "==> состояние"
          docker compose ps
          REMOTE

      # ТОЛЬКО отчёт: шаг не валит выкатку ни при одном исходе проб. Его
      # предмет — не исправность выкатки, а разделение гипотез о пропаже UDP
      # у подключённого клиента (TCP через туннель идёт, UDP 53 и 123 — нет).
      # Красный шаг здесь означал бы «не выкатывать Xray, потому что провайдер
      # фильтрует UDP», то есть ронял бы рабочую выкатку из-за наблюдения,
      # которое к ней не относится.
      #
      # Пробник идёт ТЕМ ЖЕ путём, что исход Xray: `--network edge` — та же
      # внешняя сеть, единственная у контейнера xray, то есть тот же мост,
      # тот же NAT хоста и тот же firewall за ним. `--network host` рядом —
      # контрольная проба: она минует мост и NAT docker'а.
      #
      # Это НЕ `docker compose exec` в прод (AGENTS.md, п. 3): запускается
      # отдельный одноразовый контейнер стокового образа — без env_file, без
      # монтирований, без доступа к secrets.env и к тому `conf`. Он не трогает
      # ни одну службу проекта и исчезает по `--rm`.
      - name: Исход UDP с того же пути, которым выходит Xray (только отчёт)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' || echo "UDP-PROBE: шаг не доехал до сервера — это НЕ наблюдение о UDP"
          # Без `set -e`: отказ пробы — это результат пробы, а не отказ шага.
          set -uo pipefail
          cd ~/vpn/deploy

          # Образ берётся ИЗ compose, а не записан здесь второй раз — как
          # образ Xray в ci.yml. Пробник обязан быть тем же стоковым alpine по
          # тому же digest, который уже стоит у единицы render: иначе на
          # сервер приезжал бы образ, которого нет ни в одной строке диффа.
          # awk, а не `docker compose config | jq`: jq на сервере не требуется
          # ничем, и его отсутствие превратило бы диагностику в отказ.
          img=$(awk '/^  render:/{f=1} f && $1=="image:"{print $2; exit}' compose.yml)
          case "${img:-}" in
            *@sha256:*) echo "UDP-PROBE образ пробника (из compose, единица render): $img" ;;
            *) echo "UDP-PROBE: образ render не прочитался из compose или не закреплён digest'ом — пробы НЕ запускались"; exit 0 ;;
          esac

          # Обе пробы адресуют цель IP-адресом, а не именем. Имя потребовало бы
          # DNS, и тогда отказ NTP-пробы нельзя было бы отличить от отказа DNS:
          # одна улика на две гипотезы.
          #   dns-udp-53: busybox nslookup с явным сервером спрашивает по UDP.
          #   ntp-udp-123: 48 байт клиентского пакета NTP (0x1b = LI 0, VN 3,
          #     mode 3 client, остальное нули) и ответ сервера. Форма проверена
          #     живьём. 162.159.200.123 — адрес time.cloudflare.com, то есть
          #     ровно то, на чём не работает `sntp` владельца.
          # Применён ответ или нет — не спрашивается: ответ пришёл == UDP 123
          # прошёл в обе стороны. Поэтому и не нужен applet ntpd, которому для
          # установки часов понадобился бы CAP_SYS_TIME, и отказ прав был бы
          # не отличим от отказа сети.
          probe='
          net="$1"
          if timeout 5 nslookup example.com 1.1.1.1 >/dev/null 2>&1; then r=ok; else r=FAIL; fi
          echo "UDP-PROBE $net dns-udp-53 (запрос к 1.1.1.1): $r"
          n=$({ printf "\033"; head -c 47 /dev/zero; } | timeout 8 nc -u -w 5 162.159.200.123 123 2>/dev/null | wc -c | tr -d " ")
          if [ "${n:-0}" -ge 48 ]; then r="ok (ответ $n байт)"; else r="FAIL (ответ ${n:-0} байт)"; fi
          echo "UDP-PROBE $net ntp-udp-123 (162.159.200.123): $r"
          '

          docker run --rm --network edge "$img" sh -c "$probe" probe edge 2>&1 \
            || echo "UDP-PROBE edge: контейнер не запустился — это НЕ наблюдение о UDP"
          docker run --rm --network host "$img" sh -c "$probe" probe host 2>&1 \
            || echo "UDP-PROBE host: контейнер не запустился — это НЕ наблюдение о UDP"

          echo "UDP-PROBE как читать: host FAIL  -> UDP режет хост или провайдер (не клиент и не docker);"
          echo "UDP-PROBE               host ok, edge FAIL -> режется путь моста edge и NAT хоста;"
          echo "UDP-PROBE               оба ok  -> исход UDP сервера цел, пропажа UDP у клиента"
          echo "UDP-PROBE               лежит в самом клиенте или в его обработке Xray, а не в сети сервера."
          REMOTE

      - name: Чего выкатка не доказала
        run: |
          # Названо шагом, а не комментарием: зелёный прогон здесь легко
          # прочитать как «VPN работает».
          echo "Выкатка доказала: конфиг собран без плейсхолдеров, контейнер xray пересоздан"
          echo "этой выкаткой и держится, то есть он читал именно новый конфиг."
          echo "Выкатка НЕ доказала: что алиас vpn в сети edge РАЗРЕШАЕТСЯ у соседей — это"
          echo "проверяет шаг CI по тексту compose, а не живой запрос; что соединение доходит"
          echo "снаружи (это единица sni проекта zpq-ai); что REALITY проходит рукопожатие;"
          echo "что устройство подключается."
          echo "Проверка — живым подключением с Mac и iPhone (ADR 2026-10-03-0353, «Ручные шаги», п. 9)."
