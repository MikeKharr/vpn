name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Сторож публичного репозитория и приманки к нему — в одном job. Красный
  # сторож без приманок не отличим от сторожа, который краснеет всегда;
  # зелёный без приманок — от сторожа, который не ловит ничего.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Секреты не попали в репозиторий
        run: bash .github/scripts/secrets-guard.sh .

      - name: Приманки краснят сторожа
        run: bash test/secrets-guard.test.sh

      # Держатель требования «Xray пересоздан этой выкаткой»: приманки
      # исполняют тот же deploy/assert-recreated.sh, который зовёт шаг
      # выкатки на сервере. Главный случай — «тот же Id»: именно он
      # воспроизводит дефект, из-за которого ротация ключа и отзыв устройства
      # не вступали в силу при зелёной выкатке.
      - name: Приманки проверки пересоздания Xray
        run: bash test/assert-recreated.test.sh

      # Держатели, появившиеся со вторым сервером (ADR 2026-10-05-2223). У
      # каждого свои приманки, и гоняются они БЕЗ docker: на вход держателям
      # идёт разобранный compose и адаптированный Caddyfile, собранные руками.
      # Поэтому приманки прогоняются и локально, до PR, — а на настоящем выводе
      # docker те же держатели исполняет job `config` ниже.
      - name: Приманки держателя наложений хостов
        run: bash test/publication-guard.test.sh

      - name: Приманки сторожа страницы маски
        run: bash test/mask-page-guard.test.sh

      - name: Приманки держателя слушателя маски
        run: bash test/mask-listener-guard.test.sh

      # Карта хостов bin/make-link.sh: ссылка с именем одного сервера и
      # адресом другого по форме безупречна и просто не подключается.
      - name: Карта хостов генератора ссылок
        run: bash test/make-link.test.sh

      # deploy/bootstrap.sh целиком без сервера не проверить, и приманки этого
      # не изображают: они держат разбор аргументов (включая форму адресов
      # FAIL2BAN_IGNOREIP), то одно свойство файла, на которое опирается
      # разрешение запускать его формой
      # `ssh … 'bash -s -- <имя>' < deploy/bootstrap.sh` (ADR 2026-10-06-1054),
      # и две функции, вырезанные из файла по позиции и прогнанные на
      # подставных командах: `reload_sshd` (не трогает ssh.socket — его
      # перезапуск убивал сессию запуска) и `extra_listeners` (петлевые адреса
      # не считаются внешними). Оба отказа — находки живого прогона 2026-10-07.
      - name: Приманки bootstrap — аргументы, целость тела, reload_sshd и фильтр слушателей
        run: bash test/bootstrap.test.sh

  # Конфиг Xray. Сначала отказы рендера, потом само ядро на отрендеренном
  # шаблоне: `xray run -test` отвечает на вопрос «этот конфиг ядро примет»,
  # и отвечает тот же образ по тому же digest, что пойдёт на сервер.
  #
  # ЧТО ЭТОТ JOB НЕ ЛОВИТ: подключится ли устройство. `-test` разбирает
  # конфиг и не поднимает слушателей, не ходит в target и не знает ни одного
  # клиента. Рукопожатие проверяется только живым подключением с устройства
  # (ADR 2026-10-03-0353, «Ручные шаги», п. 9).
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Отказы рендера громкие
        run: bash test/render.test.sh

      # Клиентский конфиг Happ: исполняется тот же файл bin/make-happ-json.sh,
      # который запускает владелец, на фиктивных значениях. Держится форма
      # выхода целиком (полное равенство разобранного конфига ожидаемому),
      # права, запрет перезаписи ключа th2, отсутствие значений в аргументах
      # процессов и `xray run -test` тем же образом по тому же digest'у, что
      # у шага «Конфиг Xray проходит xray run -test на каждом наложении»:
      # образ берётся из deploy/compose.yml, а не записан здесь второй раз.
      #
      # ЧТО ЭТОТ ШАГ НЕ ЛОВИТ: подключится ли Happ. `-test` разбирает конфиг и
      # не поднимает ни одного соединения; что `fallbackTag` срабатывает
      # живьём и что сборка Happ несёт `observatory` и `balancers` —
      # проверяется только импортом на устройстве (ADR 2026-10-05-2223,
      # «Ручные шаги», шаг 7).
      - name: Клиентский конфиг Happ собирается, и ядро его принимает
        run: bash test/make-happ-json.test.sh

      - name: Фиктивные значения для рендера
        run: |
          set -euo pipefail
          # Значения создаются здесь и живут один прогон. Форма годная, суть
          # фиктивная: ключ — случайные 32 байта, UUID — из ядра раннера.
          # umask 077: файл не должен быть читаем лишним на раннере.
          #
          # XRAY_TARGET сюда НЕ пишется, и это не пропуск. Строка с ним стояла
          # здесь мёртвой — шаг ниже всё равно перекрывал значение тем, что
          # взято из compose. Мёртвой, но не безвредной: при удалении строки с
          # `jq` рендер молча подхватил бы это значение из файла вместо отказа,
          # то есть держатель контракта разоружался бы бесшумно. Теперь без
          # строки с `jq` переменной нет вовсе, и render.sh падает с кодом 2
          # (находка reviewer).
          umask 077
          mkdir -p temp
          {
            printf 'REALITY_PRIVATE_KEY=%s\n' "$(openssl rand 32 | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            printf 'UUID_MAC=%s\n' "$(cat /proc/sys/kernel/random/uuid)"
            printf 'UUID_IPHONE=%s\n' "$(cat /proc/sys/kernel/random/uuid)"
            printf 'SHORTID_MAC=%s\n' "$(openssl rand -hex 4)"
            printf 'SHORTID_IPHONE=%s\n' "$(openssl rand -hex 4)"
          } > temp/secrets.env
          # Тот же файл нужен `docker compose config` ниже: у единицы render
          # он стоит required: true.
          cp temp/secrets.env deploy/secrets.env

      - name: Наложения хостов разбираются и держат публикации
        run: |
          set -euo pipefail
          mkdir -p temp
          # Разбирается НАЛОЖЕНИЕ, а не общая часть: сама по себе она не
          # запускается и портов не публикует вовсе. Что получится на хосте,
          # знает только слияние двух файлов, и делает его docker — тот же код,
          # что исполняет выкатка.
          for h in th1 th2; do
            echo "::group::наложение $h"
            docker compose -f deploy/compose.yml -f "deploy/hosts/$h/compose.yml" \
              config --format json > "temp/compose-$h.json"
            bash .github/scripts/publication-guard.sh "$h" "temp/compose-$h.json"
            echo "::endgroup::"
          done

      - name: Конфиг Xray проходит xray run -test на каждом наложении
        run: |
          set -euo pipefail
          # Исполняется deploy/render/render.sh — тот самый файл, что
          # монтируется в единицу render на сервере. Копии рендера в CI нет.
          set -a
          # shellcheck disable=SC1091
          . ./temp/secrets.env
          set +a
          for h in th1 th2; do
            echo "::group::xray run -test на наложении $h"
            # XRAY_TARGET и MASK_NAME берутся ИЗ наложения, а не записаны здесь
            # вторым местом: иначе CI рендерил бы конфиг с одними значениями, а
            # сервер — с другими, и расхождение прогон бы не заметил. Их
            # ЗНАЧЕНИЯ сверяет держатель наложений шагом выше; здесь важно
            # только, что конфиг с ними ядро принимает.
            XRAY_TARGET=$(jq -r '.services.render.environment.XRAY_TARGET' "temp/compose-$h.json")
            MASK_NAME=$(jq -r '.services.render.environment.MASK_NAME' "temp/compose-$h.json")
            export XRAY_TARGET MASK_NAME
            echo "из наложения: XRAY_TARGET=$XRAY_TARGET MASK_NAME=$MASK_NAME"
            mkdir -p "temp/conf-$h"
            TEMPLATE=deploy/config.template.json OUT="temp/conf-$h/config.json" \
              sh deploy/render/render.sh
            # render.sh кладёт результат под 0400 и чужим владельцем не делает:
            # прогон идёт не от root. Образ Xray работает под uid 65532, и без
            # этой строки он получил бы permission denied, а шаг — отказ,
            # который выглядел бы отказом конфига.
            chmod 644 "temp/conf-$h/config.json"
            # Образ берётся ИЗ наложения, а не записан здесь: иначе CI проверял
            # бы одну версию ядра, а сервер запускал другую. Закреплённость
            # digest'ом держит publication-guard.sh шагом выше.
            image=$(jq -r '.services.xray.image' "temp/compose-$h.json")
            echo "образ из наложения: $image"
            docker run --rm -v "$PWD/temp/conf-$h:/conf:ro" "$image" \
              run -c /conf/config.json -test
            echo "::endgroup::"
          done
          # Один шаблон на два хоста — и это проверено тем, что ядро приняло
          # ОБА отрендеренных конфига, а не тем, что файл один.

      # Маска th2 живёт в этом репозитории, поэтому и её держатели — здесь.
      # У th1 маска в MikeKharr/zpq-ai, и её держит шаг CI того репозитория.
      - name: Страница маски th2 ничего не выдаёт и закрыта от роботов
        run: bash .github/scripts/mask-page-guard.sh deploy/hosts/th2/cdn

      - name: Слушатель маски th2 — noindex, без h3, строгий SNI
        run: |
          set -euo pipefail
          # Проверяется РЕЗУЛЬТАТ адаптации, а не текст Caddyfile: grep по
          # файлу зеленел бы и на заголовке, уехавшем в чужой блок, и на
          # `protocols`, заданном не тому серверу.
          #
          # Образ Caddy берётся ИЗ наложения по digest — адаптирует та же
          # версия, что потом исполняет конфигурацию на сервере.
          image=$(jq -r '.services.mask.image' temp/compose-th2.json)
          echo "образ Caddy из наложения: $image"
          docker run --rm -v "$PWD/deploy/hosts/th2:/w:ro" -w /w "$image" \
            caddy adapt --config Caddyfile > temp/caddy-th2.json
          bash .github/scripts/mask-listener-guard.sh temp/caddy-th2.json

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: shellcheck по скриптам
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          echo "$files"
          # Линтер не ставится отдельно: он есть на ubuntu-latest.
          # SC2086: список имён нужен словами, имена файлов проекта без пробелов.
          # shellcheck disable=SC2086
          shellcheck $files

  # actionlint по всем workflow: синтаксис, выражения ${{ }}, имена событий и
  # shellcheck по телам run:.
  #
  # ЧТО ЭТОТ ШАГ НЕ ЛОВИТ: «подстраховки» вида `cmd || echo пусто`, из-за
  # которых упавшая команда даёт зелёный результат. Для shellcheck это
  # корректный код. Дефекты этого класса ловит только мутация, прогнанная
  # автором («Красная ветвь» в описании PR).
  #
  # Версия образа закреплена: новый релиз линтера не должен краснить CI сам
  # по себе — обновление отдельным PR, как у любого пина.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Линт workflow (actionlint + shellcheck по run:)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Единая обязательная проверка для защиты ветки: имя check run — id job.
  ci-ok:
    needs: [guard, config, shell, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Итог зависимостей
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "guard/config/shell/actionlint: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::есть failure или cancelled"; exit 1 ;;
          esac
