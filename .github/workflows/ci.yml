name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Сторож публичного репозитория и приманки к нему — в одном job. Красный
  # сторож без приманок не отличим от сторожа, который краснеет всегда;
  # зелёный без приманок — от сторожа, который не ловит ничего.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Секреты не попали в репозиторий
        run: bash .github/scripts/secrets-guard.sh .

      - name: Приманки краснят сторожа
        run: bash test/secrets-guard.test.sh

      # Держатель дисциплины секретов в bin/make-clash.sh: скрытый ввод с
      # проверкой формы, права 0700/0600, один файл, путь в stdout и — главное
      # — ни одного значения в аргументах внешнего процесса. Прогон идёт на
      # Linux, хотя скрипт для Mac: ни одна из проверок не зависит от macOS,
      # путь `~/Library/Application Support` здесь просто путь. Чего этот шаг
      # НЕ проверяет: примет ли профиль сам mihomo — ядра в CI нет, и это
      # живая проверка с Mac (ADR 2026-10-04-1726, «Проверка на Mac»).
      - name: bin/make-clash.sh не отдаёт значения наружу
        run: bash test/make-clash.test.sh

      # Держатель требования «Xray пересоздан этой выкаткой»: приманки
      # исполняют тот же deploy/assert-recreated.sh, который зовёт шаг
      # выкатки на сервере. Главный случай — «тот же Id»: именно он
      # воспроизводит дефект, из-за которого ротация ключа и отзыв устройства
      # не вступали в силу при зелёной выкатке.
      - name: Приманки проверки пересоздания Xray
        run: bash test/assert-recreated.test.sh

  # Конфиг Xray. Сначала отказы рендера, потом само ядро на отрендеренном
  # шаблоне: `xray run -test` отвечает на вопрос «этот конфиг ядро примет»,
  # и отвечает тот же образ по тому же digest, что пойдёт на сервер.
  #
  # ЧТО ЭТОТ JOB НЕ ЛОВИТ: подключится ли устройство. `-test` разбирает
  # конфиг и не поднимает слушателей, не ходит в target и не знает ни одного
  # клиента. Рукопожатие проверяется только живым подключением с устройства
  # (ADR 2026-10-03-0353, «Ручные шаги», п. 9).
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Отказы рендера громкие
        run: bash test/render.test.sh

      - name: Фиктивные значения для рендера
        run: |
          set -euo pipefail
          # Значения создаются здесь и живут один прогон. Форма годная, суть
          # фиктивная: ключ — случайные 32 байта, UUID — из ядра раннера.
          # umask 077: файл не должен быть читаем лишним на раннере.
          #
          # XRAY_TARGET сюда НЕ пишется, и это не пропуск. Строка с ним стояла
          # здесь мёртвой — шаг ниже всё равно перекрывал значение тем, что
          # взято из compose. Мёртвой, но не безвредной: при удалении строки с
          # `jq` рендер молча подхватил бы это значение из файла вместо отказа,
          # то есть держатель контракта разоружался бы бесшумно. Теперь без
          # строки с `jq` переменной нет вовсе, и render.sh падает с кодом 2
          # (находка reviewer).
          umask 077
          mkdir -p temp
          {
            printf 'REALITY_PRIVATE_KEY=%s\n' "$(openssl rand 32 | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
            printf 'UUID_MAC=%s\n' "$(cat /proc/sys/kernel/random/uuid)"
            printf 'UUID_IPHONE=%s\n' "$(cat /proc/sys/kernel/random/uuid)"
            printf 'SHORTID_MAC=%s\n' "$(openssl rand -hex 4)"
            printf 'SHORTID_IPHONE=%s\n' "$(openssl rand -hex 4)"
          } > temp/secrets.env
          # Тот же файл нужен `docker compose config` ниже: у единицы render
          # он стоит required: true.
          cp temp/secrets.env deploy/secrets.env

      - name: Конфиг Xray проходит xray run -test
        run: |
          set -euo pipefail
          mkdir -p temp/conf
          # Исполняется deploy/render/render.sh — тот самый файл, что
          # монтируется в единицу render на сервере. Копии рендера в CI нет.
          set -a
          # shellcheck disable=SC1091
          . ./temp/secrets.env
          set +a
          # XRAY_TARGET берётся ИЗ compose, а не записан здесь второй раз: иначе
          # CI рендерил бы конфиг с одним target, а сервер — с другим, и
          # расхождение контракта прогон бы не заметил.
          XRAY_TARGET=$(docker compose -f deploy/compose.yml config --format json | jq -r '.services.render.environment.XRAY_TARGET')
          echo "XRAY_TARGET из compose: $XRAY_TARGET"
          export XRAY_TARGET
          TEMPLATE=deploy/config.template.json OUT=temp/conf/config.json \
            sh deploy/render/render.sh
          # render.sh кладёт результат под 0400 и чужим владельцем не делает:
          # прогон идёт не от root. Образ Xray работает под uid 65532, и без
          # этой строки он получил бы permission denied, а шаг — отказ,
          # который выглядел бы отказом конфига.
          chmod 644 temp/conf/config.json
          # Образ берётся ИЗ compose, а не записан здесь второй раз: иначе
          # CI проверял бы одну версию ядра, а сервер запускал другую.
          image=$(docker compose -f deploy/compose.yml config --format json | jq -r '.services.xray.image')
          echo "образ из compose: $image"
          case "$image" in
            *@sha256:*) ;;
            *) echo "::error::образ Xray в compose не закреплён digest'ом"; exit 1 ;;
          esac
          docker run --rm -v "$PWD/temp/conf:/conf:ro" "$image" run -c /conf/config.json -test

      - name: Compose разбирается и наружу опубликован ровно один порт
        run: |
          set -euo pipefail
          json=$(docker compose -f deploy/compose.yml config --format json)
          # Наружу публикуется РОВНО ОДИН порт: у службы xray, формы
          # `<конкретный IPv4>:443:8443` (ADR 2026-10-05-1546, п. 7). Части
          # формы держатся по отдельности, потому что ломаются они по-разному,
          # и ни один из этих отказов не виден без этого шага:
          #
          #   host_ip пустой (голое `443:8443`) или 0.0.0.0 — это ВСЕ адреса
          #   машины: Xray отнял бы 443 у единицы `sni` на прежнем адресе и
          #   уронил сайты. Признак пришёл бы не отсюда, а с прода —
          #   `port is already allocated` на выкатке, уже после
          #   `--force-recreate`, то есть при лежащем VPN.
          #   published != 443 — имя cdn.zpq.ai перестаёт быть «родным для
          #   своего адреса»: маска отвечает на 443 или не отвечает вовсе.
          #   target != 8443 — публикация вела бы в inbound vless-443 с
          #   `acceptProxyProtocol: true`, где Xray требует заголовок PROXY
          #   (политика REQUIRE, ADR п. 1). Выкатка зелёная, маска снаружи
          #   молчит, клиент не подключается.
          #   второй порт — незамеченное расширение поверхности публичной
          #   машины; снятие единственного — обрыв рабочего входа. И то и
          #   другое — отдельное решение, а не попутная правка.
          ports=$(printf '%s' "$json" | jq -c '[.services | to_entries[] | {svc: .key, p: (.value.ports // [])[]}]')
          count=$(printf '%s' "$ports" | jq 'length')
          if [ "$count" != 1 ]; then
            echo "::error::наружу опубликовано портов: $count, а их ровно один — у службы xray, формы <конкретный IPv4>:443:8443 (ADR 2026-10-05-1546, п. 7). Вторая публикация и снятие этой — отдельное решение и отдельный PR"
            echo "::error::что разобрано: $ports"
            exit 1
          fi
          # Положительный контроль ФОРМЫ вывода: `docker compose config`
          # нормализует ports в длинную форму (host_ip/published/target/
          # protocol). Если версия compose начнёт отдавать короткую строку,
          # проверки частей ниже не нашли бы ни одного поля — пусть это будет
          # отказ с причиной, а не зелёный шаг, который ничего не проверил.
          kind=$(printf '%s' "$ports" | jq -r '.[0].p | type')
          if [ "$kind" != object ]; then
            echo "::error::docker compose config отдал ports не длинной формой, а $kind — проверки host_ip/published/target ниже перестали бы что-либо проверять"
            exit 1
          fi
          svc=$(printf '%s' "$ports" | jq -r '.[0].svc')
          host_ip=$(printf '%s' "$ports" | jq -r '.[0].p.host_ip // ""')
          # published приходит строкой в одних версиях compose и числом в
          # других — отсюда tostring, иначе сравнение зеленело бы или краснело
          # бы от версии раннера, а не от содержимого compose.
          published=$(printf '%s' "$ports" | jq -r '.[0].p.published | tostring')
          target=$(printf '%s' "$ports" | jq -r '.[0].p.target | tostring')
          proto=$(printf '%s' "$ports" | jq -r '.[0].p.protocol // "tcp"')
          echo "публикация: служба=$svc адрес=$host_ip снаружи=$published внутри=$target протокол=$proto"
          bad=''
          [ "$svc" = xray ] || bad="$bad служба=$svc(ожидалась xray)"
          case "$host_ip" in
            '') bad="$bad адрес-не-задан(голое 443:8443 — это ВСЕ адреса машины)" ;;
            0.0.0.0|::|'[::]'|'*') bad="$bad адрес=$host_ip(все адреса машины)" ;;
            *) printf '%s' "$host_ip" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' \
                 || bad="$bad адрес=$host_ip(не литерал IPv4)" ;;
          esac
          [ "$published" = 443 ] || bad="$bad снаружи=$published(ожидался 443)"
          [ "$target" = 8443 ] || bad="$bad внутри=$target(ожидался 8443)"
          [ "$proto" = tcp ] || bad="$bad протокол=$proto(ожидался tcp)"
          if [ -n "$bad" ]; then
            echo "::error::публикация порта не той формы:$bad — требуется <конкретный IPv4>:443:8443 у службы xray (ADR 2026-10-05-1546, п. 1 и 7)"
            exit 1
          fi
          echo "ok: наружу опубликован ровно один порт — $host_ip:443 в xray:8443/tcp"
          # Алиас в edge — строка межрепозиторного контракта: по нему sni
          # проекта zpq-ai находит контейнер. Переименование тихо ломает VPN.
          alias=$(printf '%s' "$json" | jq -r '.services.xray.networks.edge.aliases // [] | join(" ")')
          case " $alias " in
            *" vpn "*) echo "ok: алиас vpn в сети edge на месте" ;;
            *) echo "::error::у службы xray нет алиаса vpn в сети edge — sni не найдёт её"; exit 1 ;;
          esac
          # XRAY_TARGET — вторая строка межрепозиторного контракта, и держится
          # она так же, как алиас `vpn`: сверкой со значением, записанным здесь.
          # Прежде значение жило в secrets.env на сервере, где его не видел ни
          # один шаг, и опечатка `caddy:443` прошла бы и проверку формы, и
          # `xray run -test`, и выкатку — признаком остался бы только
          # неподключающийся клиент (находка reviewer).
          #
          # Порт 8444, а не 443: отдельный внутренний слушатель Caddy проекта
          # zpq-ai, за которым стоит только страница маски. Проброс в общий вход
          # на 443 открывал бы клиенту VPN все имена машины — блокирующая к ADR
          # zpq-ai 2026-10-03-1544. Смена значения — правка ЭТОЙ строки и строки
          # в compose вместе, то есть видимая в диффе.
          want_target='zpq:8444'
          target=$(printf '%s' "$json" | jq -r '.services.render.environment.XRAY_TARGET // ""')
          if [ "$target" != "$want_target" ]; then
            echo "::error::XRAY_TARGET в compose равен '$target', а контракт требует '$want_target' — см. ADR 2026-10-03-0353, п. 1 и ADR zpq-ai 2026-10-03-1544"
            exit 1
          fi
          echo "ok: XRAY_TARGET равен контрактному"

          # Секреты видит ТОЛЬКО render. Проверка идёт по упоминанию
          # `secrets.env` или имени REALITY_PRIVATE_KEY в службе целиком, а не
          # по полю env_file: `docker compose config` в разных версиях то
          # оставляет env_file путями, то разрешает его в environment, и
          # проверка `has("env_file")` в одной из этих форм зеленела бы всегда,
          # то есть молча не проверяла бы ничего. Сверено на четырёх формах
          # вывода («Красная ветвь» в описании PR). Сам $json в журнал не
          # печатается: в разрешённой форме он содержит значения.
          # $svc — переменная jq, не shell: кавычки одинарные намеренно.
          # shellcheck disable=SC2016
          probe='.services[$svc] | tostring | test("REALITY_PRIVATE_KEY|secrets\\.env")'
          holds_render=$(printf '%s' "$json" | jq -r --arg svc render "$probe")
          holds_xray=$(printf '%s' "$json" | jq -r --arg svc xray "$probe")
          # Положительный контроль: если бы `secrets.env` исчез из вывода и у
          # render, значит форма вывода сменилась и проверка ниже мертва.
          if [ "$holds_render" != true ]; then
            echo "::error::в выводе compose нет связи render с secrets.env — форма вывода сменилась, и проверка «ключ не у xray» перестала что-либо проверять"
            exit 1
          fi
          if [ "$holds_xray" = true ]; then
            echo "::error::служба xray упоминает secrets.env или REALITY_PRIVATE_KEY — приватный ключ попал бы в её окружение; секреты видит только render"
            exit 1
          fi
          echo "ok: секреты у render, у xray их нет"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: shellcheck по скриптам
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          echo "$files"
          # Линтер не ставится отдельно: он есть на ubuntu-latest.
          # SC2086: список имён нужен словами, имена файлов проекта без пробелов.
          # shellcheck disable=SC2086
          shellcheck $files

  # actionlint по всем workflow: синтаксис, выражения ${{ }}, имена событий и
  # shellcheck по телам run:.
  #
  # ЧТО ЭТОТ ШАГ НЕ ЛОВИТ: «подстраховки» вида `cmd || echo пусто`, из-за
  # которых упавшая команда даёт зелёный результат. Для shellcheck это
  # корректный код. Дефекты этого класса ловит только мутация, прогнанная
  # автором («Красная ветвь» в описании PR).
  #
  # Версия образа закреплена: новый релиз линтера не должен краснить CI сам
  # по себе — обновление отдельным PR, как у любого пина.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Линт workflow (actionlint + shellcheck по run:)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Единая обязательная проверка для защиты ветки: имя check run — id job.
  ci-ok:
    needs: [guard, config, shell, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Итог зависимостей
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "guard/config/shell/actionlint: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::есть failure или cancelled"; exit 1 ;;
          esac
